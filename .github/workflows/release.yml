name: Release

# Push a tag like v0.1.0 to build the binaries and the Python package, publish a
# GitHub Release and upload the package to PyPI.
# Pull requests that change packaging build everything without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc, so the binary runs on more Linux distros
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-14
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install . "pyinstaller==6.11.1"

      - name: Build binary
        run: packaging/build.sh "mocktcl-${{ matrix.target }}"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(dist/mocktcl-${{ matrix.target }} --version | cut -d' ' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "binary is $version but tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Install Tcl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y tcl
          echo "TCLSH=tclsh" >> "$GITHUB_ENV"

      - name: Install Tcl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tcl-tk@8
          echo "TCLSH=$(brew --prefix tcl-tk@8)/bin/tclsh8.6" >> "$GITHUB_ENV"

      - name: Smoke test the binary on the example project
        working-directory: examples/calculator
        run: ../../dist/mocktcl-${{ matrix.target }} --tclsh "$TCLSH" -v --fail-under 90

      - uses: actions/upload-artifact@v4
        with:
          name: mocktcl-${{ matrix.target }}
          path: dist/mocktcl-${{ matrix.target }}
          if-no-files-found: error

  python-package:
    name: Build Python package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pip install build twine && python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(/tmp/wheel-env/bin/mocktcl --version | cut -d' ' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "package is $version but tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Install Tcl
        run: sudo apt-get update && sudo apt-get install -y tcl

      - name: Smoke test the wheel on the example project
        working-directory: examples/calculator
        run: /tmp/wheel-env/bin/mocktcl -v --fail-under 90

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [build, python-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mocktcl/
    permissions:
      id-token: write # PyPI Trusted Publishing: no API token is stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mocktcl-*
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false

      - name: Add license
        run: cp src/LICENSE dist/LICENSE

      - name: Checksums
        working-directory: dist
        run: sha256sum mocktcl-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "mocktcl $GITHUB_REF_NAME" \
            --generate-notes
