[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mocktcl"
dynamic = ["version"]
description = "Testing framework for Tcl: test runner, assertions, mocking and line/branch coverage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Drummond", email = "john@muopia.com" }]
keywords = ["tcl", "testing", "unit-testing", "mocking", "coverage", "lcov"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Tcl",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Topic :: Software Development :: Testing :: Unit",
]

[project.urls]
Homepage = "https://github.com/drummondj/mocktcl"
Documentation = "https://github.com/drummondj/mocktcl#readme"
Issues = "https://github.com/drummondj/mocktcl/issues"
Releases = "https://github.com/drummondj/mocktcl/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
mocktcl = "mocktcl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mocktcl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mocktcl = ["tcl/*.tcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mocktcl"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
