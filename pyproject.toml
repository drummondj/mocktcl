[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocktcl"
version = "0.1.0"
description = "Testing framework for Tcl: test runner, assertions, mocking and line/branch coverage"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "John Drummond", email = "john@muopia.com" }]

[project.scripts]
mocktcl = "mocktcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mocktcl = ["tcl/*.tcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
